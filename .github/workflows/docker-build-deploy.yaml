name: Shared Build and Deploy

on:
    workflow_call:
        inputs:
            runner:
                description: >-
                    Which runner pool the jobs run on. Defaults to the in-cluster ARC
                    scale set, which is registered under the same name in every repo, so
                    callers never pass this. Changing the default here moves EVERY repo
                    that calls this workflow back to GitHub-hosted runners on its next
                    run -- that is the intended escape hatch when the cluster is down.
                required: false
                default: "k8s"
                type: string
            ref:
                description: "Git ref to check out and build. Set this when the caller is triggered by workflow_run (pass github.event.workflow_run.head_sha) - without it, checkout falls back to the default branch instead of the ref that actually triggered the run. Leave empty for normal push/dispatch triggers."
                required: false
                type: string
            image_name:
                description: "Override the image name (defaults to repo name)"
                required: false
                type: string
            argo_app_name:
                description: "The name of the Application in ArgoCD (defaults to repo name)"
                required: false
                type: string
            deployment_name:
                description: "The specific K8s deployment to restart (defaults to repo name)"
                required: false
                type: string
            target_namespace:
                description: "Target K8s namespace"
                required: false
                default: "default"
                type: string
            build_context:
                description: "Docker build context"
                required: false
                default: "."
                type: string
            dockerfile_path:
                description: "Path to the Dockerfile"
                required: false
                default: "./Dockerfile"
                type: string
        secrets:
            GHCR_PAT: { required: false }
            ARGOCD_TOKEN: { required: false }
            ARGOCD_SERVER: { required: false }

permissions:
    contents: read

jobs:
    build:
        runs-on: ${{ inputs.runner }}
        # GitHub's default is 360 minutes. On a self-hosted runner that is not a
        # disposable VM someone else pays for -- it is one of a small number of slots
        # on a single node, and a hung build holds one for a working day while
        # reporting nothing but "in progress". That is not hypothetical: a `RUN apk add`
        # reaching dl-cdn.alpinelinux.org from inside dind stalled here for 20+ minutes
        # and would have run to 6 hours untouched.
        #
        # 25 minutes is generous against observed builds (~1-2 min with a warm cache,
        # longer on a cold one) and still turns a hang into a bounded failure.
        timeout-minutes: 25
        outputs:
            has_argo_secrets: ${{ steps.check-secrets.outputs.has_argo_secrets }}
        steps:
            # This used to be its own `check-secrets` job. A job is a whole runner:
            # on GitHub-hosted that was a billed minute rounded up from ~5 seconds, and
            # on the in-cluster runners it is a pod creation, an image check, a runner
            # registration and a teardown -- while holding one of the maxRunners slots
            # that everything else is queueing for. For a five-line `if`.
            #
            # `build` is already running and already has the secrets, so it can answer
            # the question for free. `deploy` still keys its `if:` off this, so the
            # build-only mode (omit both secrets, deploy is skipped) behaves exactly as
            # before -- the job is skipped, not run-and-does-nothing.
            - id: check-secrets
              shell: bash
              env:
                  ARGOCD_TOKEN: ${{ secrets.ARGOCD_TOKEN }}
                  ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
              run: |
                  if [ -n "$ARGOCD_TOKEN" ] && [ -n "$ARGOCD_SERVER" ]; then
                    echo "has_argo_secrets=true" >> $GITHUB_OUTPUT
                  else
                    echo "has_argo_secrets=false" >> $GITHUB_OUTPUT
                  fi

            - name: Checkout code
              uses: actions/checkout@v7
              with:
                  ref: ${{ inputs.ref }}

            - name: Calculate Variables
              id: vars
              env:
                  IMAGE_NAME_INPUT: ${{ inputs.image_name }}
              run: |
                  REPO_OWNER_LOWER=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
                  REPO_NAME_LOWER=$(echo "$GITHUB_REPOSITORY" | cut -d '/' -f 2 | tr '[:upper:]' '[:lower:]')

                  # Use custom image name if provided, otherwise default to repo name
                  if [ -n "$IMAGE_NAME_INPUT" ]; then
                    IMAGE_NAME=$(echo "$IMAGE_NAME_INPUT" | tr '[:upper:]' '[:lower:]')
                  else
                    IMAGE_NAME=$REPO_NAME_LOWER
                  fi

                  echo "IMAGE_URL=ghcr.io/$REPO_OWNER_LOWER/$IMAGE_NAME" >> $GITHUB_ENV

            # network=host puts BuildKit in dind's own network namespace instead of
            # giving it a container on the docker0 bridge. That removes a network hop,
            # and with it an MTU mismatch that has already cost one build 20+ minutes.
            #
            # The layering without it: pod eth0 is Canal's, at MTU 1450. dockerd runs in
            # the same pod, so its own egress is that same 1450 interface -- but the
            # docker0 bridge it creates defaults to 1500, and BuildKit's container sits
            # on docker0. So BuildKit emits 1500-byte frames into a 1450-byte path. That
            # needs path-MTU discovery to work, and when the ICMP "fragmentation needed"
            # reply is filtered anywhere in between -- routinely the case -- the sender
            # never learns and simply retransmits forever.
            #
            # The symptom is diagnostic and matches exactly what we saw: small packets
            # get through, so DNS resolves and the TLS handshake completes; the first
            # full-size data packet does not, so the transfer hangs rather than failing.
            # `RUN apk add --no-cache gettext` reaching dl-cdn.alpinelinux.org stalled
            # 20+ minutes on that, while a `docker build` with no large fetch finished in
            # 60s. That line was deleted to get the build through; the cause outlived it.
            #
            # Measured 2026-08-26: the same `apk add gettext` in a bare pod in `arc`,
            # outside dind, completed in 0.57s. Cluster DNS, egress and the pod MTU are
            # all fine. The fault is in the layer dind adds, and this is the one line
            # that removes that layer.
            #
            # The chart cannot fix it from the other side: gha-runner-scale-set 0.14.2
            # hardcodes dockerd's flags with no --mtu, and `_helpers.tpl` discards a
            # values-supplied container named `dind` outright. Owning the sidecar means
            # hand-maintaining a ~60-line pod spec across every ARC upgrade. This is one
            # line, changes no chart, and reaches every caller through @main.
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4
              with:
                  driver-opts: network=host

            - name: Login to GHCR
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GHCR_PAT }}

            # cache-to/cache-from keep the BuildKit layer cache in the registry
            # rather than on the runner. Runners here are ephemeral -- every job gets a
            # fresh pod with an empty local cache -- so without this a self-hosted build
            # is SLOWER than a GitHub-hosted one, not faster. Pushed to a separate
            # :buildcache tag so it never collides with a real image tag; mode=max keeps
            # intermediate stages too, which is what makes the multi-stage web build
            # (npm install + vite build) reusable instead of just the final layer.
            - name: Build and push
              uses: docker/build-push-action@v7
              with:
                  context: ${{ inputs.build_context }}
                  file: ${{ inputs.dockerfile_path }}
                  push: true
                  tags: |
                      ${{ env.IMAGE_URL }}:${{ github.sha }}
                      ${{ env.IMAGE_URL }}:latest
                  cache-from: type=registry,ref=${{ env.IMAGE_URL }}:buildcache
                  cache-to: type=registry,ref=${{ env.IMAGE_URL }}:buildcache,mode=max

    deploy:
        needs: [build]
        if: needs.build.outputs.has_argo_secrets == 'true'
        runs-on: ${{ inputs.runner }}
        # Only curl against the ArgoCD API, with its own bounded retries: two calls, each
        # at most 5 attempts x 30s (--max-time) plus 30s of backoff, so ~6 minutes worst
        # case. If this is still going after 10 minutes it is wedged, not slow.
        timeout-minutes: 10
        concurrency:
            group: k8s-deploy-${{ inputs.argo_app_name || github.repository }}-${{ inputs.target_namespace }}
            cancel-in-progress: false
        steps:
            - name: Trigger ArgoCD Deployment
              env:
                  ARGOCD_TOKEN: ${{ secrets.ARGOCD_TOKEN }}
                  ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
                  ARGO_APP_INPUT: ${{ inputs.argo_app_name }}
                  DEPLOYMENT_INPUT: ${{ inputs.deployment_name }}
                  NAMESPACE_INPUT: ${{ inputs.target_namespace }}
              run: |
                  set -euo pipefail

                  # Fallback Logic: Input > Repo Name
                  # We convert to lowercase immediately to ensure API compatibility
                  REPO_NAME=$(echo "$GITHUB_REPOSITORY" | cut -d '/' -f 2 | tr '[:upper:]' '[:lower:]')

                  APP=${ARGO_APP_INPUT:-$REPO_NAME}
                  DEP=${DEPLOYMENT_INPUT:-$REPO_NAME}
                  NS="$NAMESPACE_INPUT"

                  echo "Targeting Argo App: $APP"
                  echo "Restarting Deployment: $DEP"

                  argo_api_post() {
                    local url="$1"
                    local payload="$2"
                    local action_name="$3"
                    local max_retries="${4:-3}"
                    local retry_count=0
                    local wait_time=2

                    local body_file
                    local header_file
                    local http_code
                    local content_type
                    local error_code
                    local curl_exit

                    while [[ $retry_count -lt $max_retries ]]; do
                      body_file=$(mktemp)
                      header_file=$(mktemp)

                      curl_exit=0
                      http_code=$(curl --silent --show-error --max-time 30 --connect-timeout 10 --output "$body_file" --dump-header "$header_file" --write-out "%{http_code}" --request POST "$url" \
                        -H "Authorization: Bearer $ARGOCD_TOKEN" \
                        -H "Content-Type: application/json" \
                        -d "$payload") || curl_exit=$?

                      if [[ $curl_exit -ne 0 ]]; then
                        rm -f "$body_file" "$header_file"

                        # Retryable: ArgoCD never answered -- DNS (6), refused (7), timeout (28),
                        # TLS handshake (35), connection dropped (52/55/56). These used to exit on
                        # the first try, so a single 10s connect timeout failed a deploy whose
                        # image was already pushed (magicounter, 2026-09-28, as the cluster came
                        # back from an outage). Retrying is safe: a second restart is just another
                        # rollout, and a second sync gets the code 9 handling below. Other curl
                        # failures (bad certificate, malformed URL) are config and still fail at once.
                        case "$curl_exit" in
                          6|7|28|35|52|55|56)
                            if [[ $retry_count -lt $((max_retries - 1)) ]]; then
                              echo "ArgoCD unreachable (curl exit $curl_exit). Retrying in ${wait_time}s (attempt $((retry_count + 1))/$max_retries)..."
                              sleep "$wait_time"
                              wait_time=$((wait_time * 2))
                              retry_count=$((retry_count + 1))
                              continue
                            fi
                            ;;
                        esac

                        echo "ArgoCD API call failed during: $action_name"
                        exit 1
                      fi

                      content_type=$(awk -F': *' 'tolower($1)=="content-type" {print tolower($2)}' "$header_file" | tr -d '\r' | tail -n 1)

                      echo "ArgoCD API status ($action_name): $http_code"

                      if [[ "$http_code" =~ ^2 ]]; then
                        echo "Response ($action_name):"
                        sed -n '1,40p' "$body_file"
                        rm -f "$body_file" "$header_file"
                        return 0
                      fi

                      # Retryable: ArgoCD "operation already in progress" (code 9), or a transient 5xx
                      error_code=$(grep -o '"code":[0-9]*' "$body_file" 2>/dev/null | grep -o '[0-9]*$' || echo "")
                      if { [[ "$error_code" == "9" ]] || [[ "$http_code" =~ ^5 ]]; } && [[ $retry_count -lt $((max_retries - 1)) ]]; then
                        echo "Retryable error (code=$error_code, http=$http_code). Retrying in ${wait_time}s (attempt $((retry_count + 1))/$max_retries)..."
                        rm -f "$body_file" "$header_file"
                        sleep "$wait_time"
                        wait_time=$((wait_time * 2))
                        retry_count=$((retry_count + 1))
                        continue
                      fi

                      # Non-retryable error
                      echo "ArgoCD API returned non-success status during: $action_name"
                      echo "Response body:"
                      sed -n '1,80p' "$body_file"

                      if [[ -n "$content_type" && "$content_type" != *"json"* ]]; then
                        echo "Unexpected content type: $content_type"
                      fi

                      if grep -qi '<html' "$body_file"; then
                        echo "Received HTML response - likely redirect/auth/proxy issue"
                      fi

                      rm -f "$body_file" "$header_file"
                      exit 1
                    done

                    echo "Max retries ($max_retries) exceeded for: $action_name"
                    exit 1
                  }

                  # Force restart of the specific component. Five attempts, like sync: as the
                  # first call, this is the one that finds ArgoCD unreachable, and against 10s
                  # connect timeouts three attempts span ~36s where five span ~80s.
                  argo_api_post \
                    "https://${ARGOCD_SERVER}/api/v1/applications/${APP}/resource/actions?namespace=${NS}&resourceName=${DEP}&version=v1&kind=Deployment&group=apps" \
                    '"restart"' \
                    "restart deployment" \
                    5

                  # Wait for restart operation to complete before syncing
                  echo "Waiting 3 seconds for restart operation to settle..."
                  sleep 3

                  # Sync ONLY the specific resource (with retries for in-progress operations)
                  argo_api_post \
                    "https://${ARGOCD_SERVER}/api/v1/applications/${APP}/sync" \
                    "{\"resources\": [{\"group\": \"apps\", \"kind\": \"Deployment\", \"name\": \"$DEP\", \"namespace\": \"$NS\"}]}" \
                    "sync deployment" \
                    5
